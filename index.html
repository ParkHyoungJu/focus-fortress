<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self';" />
  <title>Focus Fortress</title>
  <link rel="stylesheet" href="./src/styles/brand.css" />
  <style>
    /* Page-local layout only. Component styling lives in brand.css. */
    body { overflow: hidden; height: 100vh; margin: 0; }
    .app-shell { height: 100vh; min-height: 0; }
    main { overflow-y: auto; min-height: 0; height: 100%; }
    .titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      padding: 0 var(--sp-2);
      background: var(--color-bg-deep);
      border-bottom: 2px solid var(--color-stone-900);
      font-family: var(--font-pixel);
      font-size: var(--fs-xs);
      color: var(--color-text-muted);
    }
    .titlebar__controls { -webkit-app-region: no-drag; display: flex; gap: 4px; }
    .titlebar__btn {
      width: 24px; height: 20px;
      background: var(--color-stone-500);
      color: var(--color-text);
      border: 2px solid var(--color-stone-900);
      font-family: var(--font-pixel);
      font-size: 9px;
      cursor: pointer;
      padding: 0;
    }
    .titlebar__btn:hover { background: var(--color-stone-300); color: var(--color-stone-900); }
    .titlebar__btn--close:hover { background: var(--color-banner-500); color: var(--color-text); }

    .app-shell { grid-template-rows: 28px var(--nav-h) 1fr; }
    .tab-panel { display: none; padding: var(--sp-3); overflow-y: auto; }
    .tab-panel[data-active="true"] { display: block; }

    .timer-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3);
    }

    .watch-status {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      padding: 2px var(--sp-2);
      background: var(--color-surface-2);
      border: 2px solid var(--color-stone-700);
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--color-text-muted);
      letter-spacing: 1px;
    }
    .watch-status[data-state="on"]  { color: var(--color-success); border-color: var(--color-success); }
    .watch-status[data-state="off"] { color: var(--color-warning); border-color: var(--color-gold-700); }
    .watch-status::before {
      content: "";
      width: 8px; height: 8px;
      background: currentColor;
      display: inline-block;
    }

    .controls-row {
      display: flex;
      gap: var(--sp-2);
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .keyword-bar {
      width: 100%;
      max-width: 520px;
      margin-top: var(--sp-3);
    }
    .keyword-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-1);
      margin-top: var(--sp-2);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px var(--sp-2);
      background: var(--color-bg-deep);
      border: 2px solid var(--color-stone-700);
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--color-text);
      letter-spacing: 1px;
    }
    .chip__x {
      background: transparent;
      color: var(--color-banner-400);
      border: none;
      cursor: pointer;
      font-family: var(--font-pixel);
      font-size: 9px;
      padding: 0 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
    }

    .bar-chart { display: flex; flex-direction: column; gap: var(--sp-2); }
    .bar-row {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      gap: var(--sp-2);
      align-items: center;
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--color-text-muted);
    }
    .bar-row__label { text-align: right; }
    .bar-row__track {
      height: 14px;
      background: var(--color-stone-700);
      border: 2px solid var(--color-stone-900);
      position: relative;
      overflow: hidden;
    }
    .bar-row__fill {
      height: 100%;
      background: var(--color-gold-500);
      background-image: linear-gradient(90deg, rgba(255,255,255,0.15) 0 2px, transparent 2px 6px);
      background-size: 6px 100%;
    }
    .bar-row__value { text-align: left; color: var(--color-gold-300); }

    .session-log {
      margin-top: var(--sp-3);
      max-height: 160px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
    }
    .session-log__row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: var(--sp-2);
      padding: 4px var(--sp-2);
      border-bottom: 1px solid var(--color-stone-700);
    }
    .session-log__row[data-result="complete"] .session-log__result { color: var(--color-success); }
    .session-log__row[data-result="failed"]   .session-log__result { color: var(--color-danger); }

    /* Level-up overlay */
    .levelup-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--color-overlay);
      z-index: var(--z-modal);
    }
    .levelup-overlay[data-visible="true"] { display: grid; place-items: center; }
    .levelup-card {
      padding: var(--sp-5) var(--sp-6);
      background: var(--color-surface);
      border: 4px solid var(--color-gold-500);
      box-shadow: var(--shadow-glow-gold), var(--shadow-pixel-lg);
      text-align: center;
      animation: levelup-pop 600ms var(--ease-out);
    }
    .levelup-card__title {
      font-family: var(--font-pixel);
      font-size: var(--fs-lg);
      color: var(--color-gold-300);
      letter-spacing: 2px;
      margin-bottom: var(--sp-2);
    }
    .levelup-card__level {
      font-family: var(--font-display);
      font-size: 72px;
      color: var(--color-gold-300);
      text-shadow: 4px 4px 0 var(--color-stone-900);
      line-height: 1;
    }
    .levelup-card__hint {
      margin-top: var(--sp-3);
      font-family: var(--font-pixel);
      font-size: 9px;
      color: var(--color-text-muted);
      letter-spacing: 1px;
    }
    @keyframes levelup-pop {
      0%   { transform: scale(0.6); opacity: 0; }
      60%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .unlock-toast-list {
      position: fixed;
      top: 64px;
      right: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      z-index: var(--z-toast);
    }

    /* ============================================================
       v0.2 — Damage feedback effects
       ============================================================ */

    /* Screen shake on damage */
    @keyframes ff-shake {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-4px, -2px); }
      20% { transform: translate(4px,  1px); }
      30% { transform: translate(-3px, 3px); }
      40% { transform: translate(5px, -1px); }
      50% { transform: translate(-4px, -4px); }
      60% { transform: translate(3px,  2px); }
      70% { transform: translate(-5px, 1px); }
      80% { transform: translate(3px, -2px); }
      90% { transform: translate(-2px, 3px); }
    }
    .app-shell.shake { animation: ff-shake 420ms ease-in-out; }

    /* Red flash overlay */
    .damage-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at center,
          rgba(255, 60, 60, 0.45) 0%,
          rgba(180, 20, 20, 0.20) 60%,
          transparent 100%);
      z-index: 9998;
    }
    .damage-flash.flash { animation: ff-flash 420ms ease-out; }
    @keyframes ff-flash {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Damage number popup (bubbles up from HP bar) */
    #damage-popup-host {
      position: relative;
      width: 100%;
      pointer-events: none;
      height: 0;
    }
    .dmg-popup {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 900;
      color: #ff4d4d;
      text-shadow:
        3px 3px 0 #2a0808,
        0 0 14px rgba(255, 80, 80, 0.85);
      letter-spacing: 1px;
      pointer-events: none;
      animation: ff-dmg-pop 1200ms ease-out forwards;
      z-index: 100;
      white-space: nowrap;
    }
    @keyframes ff-dmg-pop {
      0%   { transform: translateX(-50%) translateY(0)    scale(0.6); opacity: 0; }
      15%  { transform: translateX(-50%) translateY(-12px) scale(1.4); opacity: 1; }
      40%  { transform: translateX(-50%) translateY(-32px) scale(1.0); opacity: 1; }
      100% { transform: translateX(-50%) translateY(-90px) scale(0.85); opacity: 0; }
    }

    /* ============================================================
       v0.2 — HP-tiered castle damage states
       ============================================================ */

    /* MID (HP <= 60): subtle wobble + dimming towers */
    .castle-frame[data-hp-level="mid"] .castle-frame__castle {
      animation: castle-wobble 2.4s ease-in-out infinite;
      filter: brightness(0.85);
    }
    .castle-frame[data-hp-level="mid"] .castle-frame__castle::before,
    .castle-frame[data-hp-level="mid"] .castle-frame__castle::after {
      filter: brightness(0.78);
    }
    /* visible crack across the keep */
    .castle-frame[data-hp-level="mid"] .castle-frame__castle {
      background-image:
        linear-gradient(115deg,
          transparent 38%,
          rgba(0,0,0,0.55) 38%,
          rgba(0,0,0,0.55) 40%,
          transparent 40%,
          transparent 62%,
          rgba(0,0,0,0.45) 62%,
          rgba(0,0,0,0.45) 63%,
          transparent 63%);
    }
    @keyframes castle-wobble {
      0%, 100% { transform: translateX(-50%); }
      50%      { transform: translateX(calc(-50% + 2px)); }
    }

    /* LOW (HP <= 30): heavy shake, dark/red tint, banner tear, knight collapse, vignette */
    .castle-frame[data-hp-level="low"] .castle-frame__castle {
      animation: castle-shake 380ms ease-in-out infinite;
      filter: brightness(0.55) saturate(0.8) hue-rotate(-12deg);
      box-shadow:
        inset 0 -6px 0 var(--color-stone-900),
        inset 0 6px 0 var(--color-stone-700),
        0 0 28px rgba(255, 50, 50, 0.55);
      background-image:
        linear-gradient(105deg,
          transparent 22%,
          rgba(0,0,0,0.7) 22%,
          rgba(0,0,0,0.7) 25%,
          transparent 25%,
          transparent 48%,
          rgba(0,0,0,0.65) 48%,
          rgba(0,0,0,0.65) 51%,
          transparent 51%,
          transparent 74%,
          rgba(0,0,0,0.7) 74%,
          rgba(0,0,0,0.7) 77%,
          transparent 77%);
    }
    .castle-frame[data-hp-level="low"] .castle-frame__castle::before,
    .castle-frame[data-hp-level="low"] .castle-frame__castle::after {
      filter: brightness(0.4) saturate(0.6);
      background: var(--color-stone-700);
    }
    @keyframes castle-shake {
      0%, 100% { transform: translateX(-50%); }
      25%  { transform: translateX(calc(-50% - 3px)) rotate(-0.5deg); }
      50%  { transform: translateX(calc(-50% + 3px)) rotate(0.5deg); }
      75%  { transform: translateX(calc(-50% - 2px)); }
    }
    .castle-frame[data-hp-level="low"] .castle-frame__banner::after {
      animation: banner-tear 800ms ease-in-out infinite;
      background: #5a1010;
    }
    @keyframes banner-tear {
      0%, 100% { transform: skewX(0)    scaleY(1);   opacity: 1; }
      50%      { transform: skewX(18deg) scaleY(0.85); opacity: 0.55; }
    }
    .castle-frame[data-hp-level="low"] .castle-frame__knight {
      animation: none;
      filter: grayscale(0.7) brightness(0.6);
      opacity: 0.55;
    }

    /* Vignette overlay inside castle frame on low HP */
    .castle-frame[data-hp-level="low"]::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center,
          transparent 25%,
          rgba(180, 20, 20, 0.18) 70%,
          rgba(120, 10, 10, 0.35) 100%);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Frameless titlebar -->
    <div class="titlebar">
      <span>FOCUS FORTRESS v0.2.0</span>
      <div class="titlebar__controls">
        <button class="titlebar__btn" id="btn-min" title="Minimize">_</button>
        <button class="titlebar__btn titlebar__btn--close" id="btn-close" title="Close">X</button>
      </div>
    </div>

    <!-- Tabs -->
    <nav class="nav">
      <div class="nav__brand">[FOCUS FORTRESS]</div>
      <div class="nav__tabs" role="tablist">
        <button class="nav__tab" role="tab" data-tab="timer" aria-selected="true">TIMER</button>
        <button class="nav__tab" role="tab" data-tab="achieve" aria-selected="false">ACHIEVE</button>
        <button class="nav__tab" role="tab" data-tab="stats" aria-selected="false">STATS</button>
      </div>
    </nav>

    <main>
      <!-- ===== TIMER TAB ===== -->
      <section class="tab-panel" data-tab-panel="timer" data-active="true">
        <div class="timer-layout">
          <span class="watch-status" id="watch-status" data-state="loading">WATCH: INIT</span>

          <div class="castle-frame">
            <div class="castle-frame__stage"></div>
            <div class="castle-frame__castle"></div>
            <div class="castle-frame__banner"></div>
            <div class="castle-frame__knight"></div>
          </div>

          <div id="damage-popup-host" aria-hidden="true"></div>

          <div class="hp-bar" id="hp-bar" data-level="high">
            <div class="hp-bar__label">
              <span>HP</span>
              <span><span id="hp-value">100</span> / 100</span>
            </div>
            <div class="hp-bar__track">
              <div class="hp-bar__fill" id="hp-fill" style="width: 100%;"></div>
            </div>
          </div>

          <div class="timer">
            <div class="timer__phase" id="timer-phase">FOCUS #1</div>
            <div class="timer__clock" id="timer-clock" data-state="idle">25:00</div>
            <div class="timer__meta">
              <span>Streak: <span class="gold" id="meta-streak">0</span></span>
              <span>XP: <span class="gold" id="meta-xp">0</span></span>
              <span>Lv: <span class="gold" id="meta-level">1</span></span>
            </div>
          </div>

          <div class="controls-row">
            <button class="btn btn--primary btn--lg" id="btn-start">START</button>
            <button class="btn btn--lg" id="btn-pause" disabled>PAUSE</button>
            <button class="btn btn--ghost btn--lg" id="btn-reset">RESET</button>
          </div>

          <div class="card keyword-bar">
            <div class="card__title">BLOCK KEYWORDS</div>
            <div class="row">
              <input class="input" id="keyword-input" placeholder="e.g. facebook" />
              <button class="btn btn--gold btn--sm" id="btn-add-keyword">ADD</button>
            </div>
            <div class="keyword-chips" id="keyword-chips"></div>
          </div>
        </div>
      </section>

      <!-- ===== ACHIEVEMENTS TAB ===== -->
      <section class="tab-panel" data-tab-panel="achieve">
        <div class="row" style="justify-content: space-between; padding: 0 var(--sp-3);">
          <h1>ACHIEVEMENTS</h1>
          <span class="pixel-text gold"><span id="achieve-count">0</span> / 10</span>
        </div>
        <div class="badge-grid" id="badge-grid"></div>
      </section>

      <!-- ===== STATS TAB ===== -->
      <section class="tab-panel" data-tab-panel="stats">
        <h1>WEEKLY REPORT</h1>
        <div class="stats-grid">
          <div class="stat">
            <span class="stat__value" id="stat-sessions">0</span>
            <span class="stat__label">SESSIONS</span>
          </div>
          <div class="stat">
            <span class="stat__value" id="stat-completion">0%</span>
            <span class="stat__label">COMPLETION</span>
          </div>
          <div class="stat">
            <span class="stat__value" id="stat-focused">0h 00m</span>
            <span class="stat__label">FOCUSED</span>
          </div>
          <div class="stat">
            <span class="stat__value" id="stat-streak">0</span>
            <span class="stat__label">STREAK</span>
          </div>
        </div>

        <div class="card">
          <div class="card__title">DAILY SESSIONS (LAST 7 DAYS)</div>
          <div class="bar-chart" id="bar-chart"></div>
        </div>

        <div class="card" style="margin-top: var(--sp-3);">
          <div class="card__title">RECENT SESSION LOG</div>
          <div class="session-log" id="session-log"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Level-up overlay -->
  <div class="levelup-overlay" id="levelup-overlay" data-visible="false">
    <div class="levelup-card">
      <div class="levelup-card__title">LEVEL UP!</div>
      <div class="levelup-card__level" id="levelup-level">2</div>
      <div class="levelup-card__hint">CLICK TO DISMISS</div>
    </div>
  </div>

  <!-- Achievement unlock toasts -->
  <div class="unlock-toast-list" id="unlock-toast-list"></div>

  <!-- v0.2 — Red damage flash overlay -->
  <div class="damage-flash" id="damage-flash" aria-hidden="true"></div>

  <script type="module" src="./src/renderer.js"></script>
</body>
</html>
